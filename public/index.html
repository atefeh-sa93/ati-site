<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ati Atashi</title>
    <meta name="robots" content="noindex" />
    <link rel="alternate" hreflang="fa" href="fa/" />
    <link rel="alternate" hreflang="en" href="en/" />
    <!--
      Static hosting has no server-side proxy, so this page picks the language:
      a saved choice first (lang cookie), then the browser's preference, else Persian.
      Paths are relative so it works both locally (/) and on GitHub Pages (/ati-site/).
    -->
    <script>
      (function () {
        var locales = ["fa", "en"];
        var saved = (document.cookie.match(/(?:^|; )lang=(fa|en)/) || [])[1];
        var preferred = (navigator.languages || [navigator.language || ""])
          .map(function (tag) { return tag.toLowerCase().split("-")[0]; })
          .filter(function (lang) { return locales.indexOf(lang) !== -1; })[0];
        location.replace((saved || preferred || "fa") + "/" + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=fa/" /></noscript>
  </head>
  <body style="background: #fbf7ff">
    <noscript><a href="fa/">فارسی</a> · <a href="en/">English</a></noscript>
  </body>
</html>
